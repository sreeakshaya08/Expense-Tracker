<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoneyVault - Account Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border-bottom: 3px solid #ffd700;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffd700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    header h1::before {
      content: "🏦 ";
      font-size: 1.5rem;
    }

    .add-btn {
      background: linear-gradient(135deg, #00a86b 0%, #00b894 100%);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .add-btn::before {
      content: "💰 ";
    }

    main {
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .account-card {
      background: #fff;
      padding: 1.5rem;
      border: 1px solid #eee;
      border-radius: 0.75rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .account-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .account-card p {
      font-size: 0.95rem;
      color: #666;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: #fff;
      padding: 2rem;
      border-radius: 0.75rem;
      width: 400px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin-bottom: 1rem;
    }

    .modal-content input {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }

    .modal-content button {
      background: #002b5b;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    .back-btn {
      background: #555;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      margin-right: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center;">
      <button class="back-btn" onclick="history.back()">← Back</button>
      <h1>MoneyVault Portfolio</h1>
    </div>
    <button class="add-btn" onclick="openModal()">Add Money Account</button>
  </header>

  <main>
    <div class="section-header">
      <h2 style="color: #ffd700; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">💰 Your Money Accounts</h2>
    </div>
    <div class="card-grid" id="accountGrid">
      <!-- Account cards will render here -->
    </div>
  </main>

  <div class="modal" id="accountModal">
    <div class="modal-content">
      <h3>💎 Add New Money Account</h3>
      <input type="text" id="accName" placeholder="Account Name">
      <input type="text" id="accBank" placeholder="Bank/Service Name">
      <input type="number" id="accBalance" placeholder="Balance or Amount">
      <button onclick="saveAccount()">Save</button>
    </div>
  </div>

  <script src="frontend/js/api.js"></script>
  <script>
    // Check authentication
    if (!api.isAuthenticated()) {
      alert("Please log in first.");
      window.location.href = "login.html";
    }

    function openModal() {
      document.getElementById('accountModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('accountModal').style.display = 'none';
      // Clear form fields
      document.getElementById("accName").value = "";
      document.getElementById("accBank").value = "";
      document.getElementById("accBalance").value = "";
    }

    async function saveAccount() {
      const name = document.getElementById("accName").value.trim();
      const bank_name = document.getElementById("accBank").value.trim();
      const balance = parseFloat(document.getElementById("accBalance").value);

      if (!name || !bank_name || isNaN(balance)) {
        alert("Please enter valid account details.");
        return;
      }

      try {
        // Show loading state
        const saveBtn = document.querySelector('#accountModal button');
        const originalText = saveBtn.textContent;
        saveBtn.textContent = 'Saving...';
        saveBtn.disabled = true;

        const response = await api.createAccount({ name, bank_name, balance });

        if (response.success) {
          closeModal();
          await renderAccounts();
          alert("Account created successfully!");
        } else {
          alert(response.message || "Failed to create account");
        }
      } catch (error) {
        console.error('Create account error:', error);
        alert(error.message || "Failed to create account. Please try again.");
      } finally {
        // Reset button state
        const saveBtn = document.querySelector('#accountModal button');
        saveBtn.textContent = 'Save';
        saveBtn.disabled = false;
      }
    }

    async function renderAccounts() {
      try {
        const response = await api.getAccounts();

        if (response.success) {
          const accounts = response.data.accounts;
          const grid = document.getElementById("accountGrid");
          grid.innerHTML = ""; // Clear previous

          if (accounts.length === 0) {
            grid.innerHTML = '<p style="text-align: center; color: #666;">No accounts found. Add your first account!</p>';
            return;
          }

          accounts.forEach(acc => {
            const card = document.createElement("div");
            card.className = "account-card";
            card.innerHTML = `
              <h4>${acc.name}</h4>
              <p>${acc.bank_name}</p>
              <p>Balance: ₹${parseFloat(acc.balance).toFixed(2)}</p>
              <small style="color: #666;">Created: ${new Date(acc.created_at).toLocaleDateString()}</small>
            `;
            grid.appendChild(card);
          });
        } else {
          console.error('Failed to load accounts:', response.message);
          document.getElementById("accountGrid").innerHTML = '<p style="text-align: center; color: red;">Failed to load accounts</p>';
        }
      } catch (error) {
        console.error('Error loading accounts:', error);
        document.getElementById("accountGrid").innerHTML = '<p style="text-align: center; color: red;">Error loading accounts</p>';
      }
    }

    // Close modal when clicking outside
    document.getElementById('accountModal').addEventListener('click', (e) => {
      if (e.target.id === 'accountModal') {
        closeModal();
      }
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', renderAccounts);
  </script>
</body>
</html>
